name: Deploy to VPS

on:
  push:
    branches:
      - master  # Se ejecuta automáticamente al hacer push a la rama master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Copy Files to VPS via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Copiamos la carpeta dist (frontend), backend (servidor) y archivos de dependencias
          source: "dist/,backend/,package.json,package-lock.json"
          target: "/var/www/salon-pro"

      - name: Install Backend Dependencies & Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/salon-pro/backend
            npm install --production
            # Reiniciar la app con PM2 (si no existe, la inicia)
            pm2 restart salon-backend || pm2 start server.js --name "salon-backend"
            # Guardar la configuración de PM2 para que sobreviva a reinicios del VPS
            pm2 save
