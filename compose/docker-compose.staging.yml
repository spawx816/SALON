networks:
  salon_edge_net:
    name: salon_edge_net
    driver: bridge
  salon_infra_net:
    name: salon_infra_net
    external: true

services:
  salonpro_caddy:
    image: caddy:2.9.1@sha256:748016f285ed8c43a9ce6e3aed6d92d3009d90ca41157950880f40beaf3ff62b
    container_name: salonpro_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - /opt/salonpro/secrets/caddy.env
    volumes:
      - /opt/salonpro/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/salonpro/logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - salon_edge_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  salonpro_app:
    image: ${APP_IMAGE:-salonpro-app:8fbe4ae}
    container_name: salonpro_app
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    env_file:
      - /opt/salonpro/secrets/staging.env
    environment:
      - NODE_ENV=staging
    networks:
      - salon_edge_net
      - salon_infra_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 768m
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://127.0.0.1:5005/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    name: salonpro_caddy_data
  caddy_config:
    name: salonpro_caddy_config
